openapi: 3.1.0
info:
  title: EAI Medplum Backbone Facade
  version: 0.1.0
components:
  securitySchemes:
    medplumOAuth:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://api.eai-medplum-staging.tech/oauth2/authorize
          tokenUrl: https://api.eai-medplum-staging.tech/oauth2/token
          scopes:
            openid: Identify the Medplum member
paths:
  /health:
    get:
      responses:
        '200':
          description: Orchestrator health
  /v1/capabilities:
    get:
      responses:
        '200':
          description: Capability ownership registry
  /v1/patients/{id}:
    get:
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: FHIR Patient from Medplum
        '404':
          description: Patient not found
        '502':
          description: Medplum upstream failure
  /v1/triage:
    post:
      security:
        - medplumOAuth: [openid]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Triage response from EAI Python sidecar
        '401':
          description: Medplum authentication is missing or invalid
        '403':
          description: Authenticated profile is not a supported Patient or Practitioner
        '501':
          description: Development placeholder is not connected
        '502':
          description: Python upstream failure
